name: Build Caddy with xcaddy

on:
  workflow_dispatch:
    inputs:
      caddy_version:
        description: 'Caddy Version (e.g. v2.10.2 or latest)'
        required: true
        default: 'latest'
        type: string
      
      modules:
        description: 'Included Modules (seperate with comma/space)'
        required: false
        default: ''
        type: string
      
      architectures:
        description: 'Arch (seperate with comma/space)'
        required: true
        default: 'linux/amd64 linux/arm64'
        type: string
      
      output_type:
        description: 'Output'
        required: true
        default: 'artifacts'
        type: choice
        options:
          - artifacts
          - release

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          ARCHS="${{ inputs.architectures }}"
          JSON_ARRAY=$(echo "$ARCHS" | tr ',' ' ' | xargs -n1 | awk 'BEGIN{printf "["} {printf "%s\"%s\"", (NR>1?",":""), $0} END{printf "]"}')
          echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "Generated matrix: $JSON_ARRAY"
  
  build:
    name: Build Caddy
    runs-on: ubuntu-latest
    needs: prepare
    
    strategy:
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.matrix) }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Parse platform
        id: parse
        run: |
          PLATFORM="${{ matrix.platform }}"
          GOOS=$(echo $PLATFORM | cut -d'/' -f1)
          GOARCH=$(echo $PLATFORM | cut -d'/' -f2)
          
          echo "goos=$GOOS" >> $GITHUB_OUTPUT
          echo "goarch=$GOARCH" >> $GITHUB_OUTPUT
          
          if [ "$GOOS" = "windows" ]; then
            FILENAME="caddy-${GOOS}-${GOARCH}.exe"
          else
            FILENAME="caddy-${GOOS}-${GOARCH}"
          fi
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
      
      - name: Install xcaddy
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
      
      - name: Build Caddy with xcaddy
        env:
          GOOS: ${{ steps.parse.outputs.goos }}
          GOARCH: ${{ steps.parse.outputs.goarch }}
          CGO_ENABLED: 0
        run: |
          XCADDY_CMD="xcaddy build"
          
          if [ "${{ inputs.caddy_version }}" != "latest" ]; then
            XCADDY_CMD="$XCADDY_CMD ${{ inputs.caddy_version }}"
          fi
          
          if [ -n "${{ inputs.modules }}" ]; then
            MODULES=$(echo "${{ inputs.modules }}" | tr ',' ' ' | xargs -n1 | sed 's/^/--with /' | tr '\n' ' ')
            XCADDY_CMD="$XCADDY_CMD $MODULES"
          fi
          
          XCADDY_CMD="$XCADDY_CMD --output ${{ steps.parse.outputs.filename }}"
          
          echo "Executing: $XCADDY_CMD"
          eval $XCADDY_CMD
      
      - name: Get Caddy version
        id: version
        run: |
          if [ "${{ steps.parse.outputs.goos }}" = "windows" ]; then
            VERSION="unknown"
          else
            VERSION=$(chmod +x ${{ steps.parse.outputs.filename }} && ./${{ steps.parse.outputs.filename }} version | head -n1 || echo "unknown")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Caddy Version: $VERSION"
      
      - name: Upload to Artifacts
        if: inputs.output_type == 'artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: caddy-${{ steps.parse.outputs.goos }}-${{ steps.parse.outputs.goarch }}
          path: ${{ steps.parse.outputs.filename }}
          retention-days: 30
      
      - name: Upload to Release
        if: inputs.output_type == 'release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: xcaddy-build-${{ github.run_number }}
          name: ${{ github.event.repository.updated_at }}
          body: |
            **Caddy Version**:
            ```
            ${{ inputs.caddy_version }}
            ```
            **Targeted Arch**:
            ```
            ${{ inputs.architectures }}
            ```
            **Included Modules**:
            ```
            ${{ inputs.modules || 'N/A' }}
            ```
          files: ${{ steps.parse.outputs.filename }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Need to Grant Workflow Write Permission at /settings/actions
  
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
      - name: Generate Summary
        run: |
          echo "## 🔔 XCaddy Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**Caddy Version**:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ inputs.caddy_version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "**Targeted Arch**:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ inputs.architectures }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "**Output To**:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ inputs.output_type }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "**Included Modules**:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.modules }}" ]; then
            echo "${{ inputs.modules }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "N/A" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
